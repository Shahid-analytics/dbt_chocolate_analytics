version: 2

models:
  - name: stg_customers
    description: "Staged customer data cleaned and renamed from the raw Customers source table."
    columns:
      - name: customer_id
        description: "Unique identifier for each customer."
        data_tests:
          - unique
          - not_null

      - name: customer_age
        description: "Age of the customer."

      - name: customer_gender
        description: "Gender of the customer."

      - name: is_loyalty_member
        description: "Indicates whether the customer is enrolled in the loyalty programme."

      - name: customer_join_date
        description: "Date the customer joined the loyalty programme or was first recorded."
        data_tests:
          - not_null

  - name: stg_products
    description: "Staged product data cleaned and renamed from the raw Products source table."
    columns:
      - name: product_id
        description: "Unique identifier for each product."
        data_tests:
          - unique
          - not_null

      - name: product_name
        description: "Name of the chocolate product."

      - name: product_brand
        description: "Brand that produces the product."

      - name: product_category
        description: "Category the product belongs to."

      - name: cocoa_percentage
        description: "Percentage of cocoa content in the product."

      - name: weight_grams
        description: "Weight of the product in grams."

  - name: stg_sales
    description: "Staged sales transactions cleaned and renamed from the raw Sales source table."
    columns:
      - name: order_id
        description: "Unique identifier for each sales order."
        data_tests:
          - unique
          - not_null

      - name: order_date
        description: "Date the order was placed."
        data_tests:
          - not_null

      - name: product_id
        description: "Foreign key referencing the product sold."

      - name: store_id
        description: "Foreign key referencing the store where the sale occurred."

      - name: customer_id
        description: "Foreign key referencing the customer who made the purchase."

      - name: quantity_sold
        description: "Number of units sold in the order."

      - name: unit_price
        description: "Price per unit at the time of the sale."

      - name: discount_amount
        description: "Discount applied to the order."

      - name: revenue
        description: "Total revenue generated from the order."

      - name: cost
        description: "Total cost of goods for the order."

  - name: stg_stores
    description: "Staged store data cleaned and renamed from the raw Stores source table."
    columns:
      - name: store_id
        description: "Unique identifier for each store."
        data_tests:
          - unique
          - not_null

      - name: store_name
        description: "Name of the store."
        data_tests:
          - not_null

      - name: store_city
        description: "City where the store is located."

      - name: store_country
        description: "Country where the store is located."

      - name: store_type
        description: "Type of store. One of: Airport, Mall, Online, Retail."
        data_tests:
          - accepted_values:
              values: ['Airport', 'Mall', 'Online', 'Retail']
