version: 2

models:
  - name: int_customer_segments
    description: "Customer-level RFM (Recency, Frequency, Monetary) aggregation joined with customer profile attributes."
    columns:
      - name: total_revenue
        description: "Sum of all revenue generated by the customer. Must not be negative."
        data_tests:
          - not_negative

      - name: total_units_purchased
        description: "Total number of units purchased by the customer. Must be greater than zero."
        data_tests:
          - is_positive
